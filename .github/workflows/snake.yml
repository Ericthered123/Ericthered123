name: Update Snake Contributions

permissions:
  contents: write
  
on:
  schedule:
    - cron: '0 * * * *'   # cada hora
  workflow_dispatch:       # también manual

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r snake_contributions/requirements.txt

      - name: Run Snake Script
        run: python snake_contributions/snake.py

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add snake_contributions.svg
          git commit -m "Update Snake Contributions" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
